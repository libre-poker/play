<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --room:#241c15; --room2:#33291f;
  --felt:#2c6e57; --felt2:#1f5240; --felt3:#17402f;
  --rail:#6e4522; --railhi:#a4713f; --raillo:#4a2d14;
  --brass:#c9a45c; --ink:#f2ede4; --ink-soft:#b8ac9a; --ink-mut:#8d8272;
  --card:#fdfbf5; --red:#c33; --black:#20242c;
  --gold:#e9c15c; --navy:#3d6ea5; --green:#3f7d4e; --danger:#d66;
  --line:#ffffff22;
  --cw:clamp(46px,5vw,62px); --ch:calc(var(--cw)*1.42);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%, var(--room2) 0%, var(--room) 55%, #150f09 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;
}
button{cursor:pointer}

/* ---- top bar */
#top{
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  border-bottom:1px solid #00000055;flex:none;flex-wrap:wrap;
}
#top .word{font-weight:800;letter-spacing:.06em;font-size:17px;text-decoration:none;color:var(--ink)}
#top .word b{color:var(--gold)}
#top .meta{font-size:12.5px;color:var(--ink-mut);font-weight:600;margin-left:10px}
#top .spacer{flex:1}
#top .div{width:1px;height:20px;background:#ffffff1e;margin:0 8px}
.chip{
  background:#00000033;border:1px solid #ffffff22;color:var(--ink);
  border-radius:8px;height:30px;display:inline-flex;align-items:center;gap:6px;
  padding:0 11px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
}
.chip:hover{background:#00000055}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.leak-ok{color:#8fd0a0} .chip.leak-bad{color:var(--danger)}

/* ---- the table */
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#tablewrap{position:relative;width:min(74vw,940px);height:min(62vh,450px);min-height:380px}
#table{
  position:absolute;inset:0;
  border-radius:50% / 48%;
  background:
    radial-gradient(ellipse 62% 55% at 50% 42%, #35836a 0%, var(--felt) 45%, var(--felt2) 78%, var(--felt3) 100%);
  border:16px solid transparent;
  background-clip:padding-box;
  box-shadow:
    inset 0 12px 34px rgba(0,0,0,.45),
    inset 0 -16px 44px rgba(0,0,0,.38);
}
#tablewrap::before{
  content:'';position:absolute;inset:-4px;border-radius:50% / 48%;
  background:linear-gradient(180deg, #9b6b3a 0%, #7a5230 38%, #5c3a1e 72%, #3a2412 100%);
  box-shadow:
    inset 0 3px 4px rgba(255,255,255,.35),
    inset 0 -6px 12px rgba(0,0,0,.65),
    0 26px 60px rgba(0,0,0,.65),
    0 6px 16px rgba(0,0,0,.5);
}
#table::after{
  content:'LIBRE POKER';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(26px,3vw,42px);letter-spacing:.5em;color:#ffffff0d;font-weight:800;
  pointer-events:none;white-space:nowrap;transition:color .4s;
}
#table.boardout::after{color:#ffffff05}

/* ---- seats */
.seat{
  position:absolute;left:50%;transform:translateX(-50%);
  width:clamp(200px,25vw,258px);
  background:linear-gradient(180deg, rgba(10,26,20,.92), rgba(6,16,12,.96));
  border:1px solid rgba(212,175,105,.30);border-radius:26px;
  padding:7px 14px 9px;color:var(--ink);
  box-shadow:0 8px 18px rgba(0,0,0,.45);
  transition:border-color .2s, box-shadow .2s, opacity .3s;
}
#seat-1{top:-24px} #seat-0{bottom:-24px}
.seat.folded{opacity:.55;filter:saturate(.6)}
.fcards{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;justify-content:center;
}
#cards-1{top:34px;z-index:4}
#cards-0{bottom:26px;z-index:4}
.seat{z-index:5}
#cards-0 .card{width:calc(var(--cw)*1.16);height:calc(var(--ch)*1.16)}
#cards-0 .card .cr{font-size:calc(var(--cw)*1.16*.34)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40}
#fx .flych{position:absolute;transition:transform .42s cubic-bezier(.45,0,.35,1), opacity .42s}
.seat.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(233,193,92,.45), 0 8px 18px rgba(0,0,0,.45)}
.seat.winner{
    border-color:#ffd97a;
    background:linear-gradient(180deg, rgba(46,38,14,.94), rgba(24,19,8,.96));
    box-shadow:0 0 0 2px #ffd97a, 0 0 34px rgba(255,217,122,.6), 0 8px 18px rgba(0,0,0,.45);
  }
.seat .who{display:flex;align-items:center;gap:9px}
.seat .idc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.seat .stkc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:0}
.seat .av{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, #3c5a4a, #1c2e24);
  border:1px solid rgba(212,175,105,.4);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.seat .nm{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.seat .pos{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#0e1a12;
  background:var(--brass);border-radius:6px;padding:1px 5px;
}
.seat .stk{font-size:16px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.seat .bbline{font-size:10.5px;color:var(--ink-mut)}
.seat .said{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;z-index:6;
}
#seat-1 .said{bottom:auto;top:-13px}
#seat-0 .said, #seat-1 .said{
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  background:#000000cc;border:1px solid #ffffff2a;border-radius:10px;
  padding:2px 11px;white-space:nowrap;min-height:0;
}
.seat .said:empty{display:none}
.seat .tbar{
  position:absolute;left:10%;right:10%;bottom:3px;height:3px;border-radius:2px;
  background:#00000040;overflow:hidden;display:none;
}
.seat.active .tbar{display:block}
.seat .tbar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:2px;transition:width .3s linear}
.seat .tbar i.drain{transition:width 30s linear;width:0}
.seat .dbtn{
  position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#d8d2c2);color:#222;
  border:2px solid var(--brass);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.55);
}

/* ---- bets as chip stacks */
.bet{
  position:absolute;left:50%;transform:translateX(-50%);
  display:none;align-items:flex-end;gap:7px;
  font-size:13px;font-weight:800;color:var(--ink);
  background:#00000052;padding:5px 13px 5px 9px;border-radius:16px;font-size:14px;
  font-variant-numeric:tabular-nums;border:1px solid #ffffff12;
}
.bet.show{display:inline-flex}
.cstack{display:flex;align-items:flex-end;gap:3px}
.cstack .col{position:relative;width:20px;height:26px}
.cstack .col i{
  position:absolute;left:0;width:20px;height:20px;border-radius:50%;
  border:2px dashed #ffffffc8;box-shadow:0 1.5px 3px #000c;
}
.cstack .col i:nth-child(1){bottom:0}
.cstack .col i:nth-child(2){bottom:5px}
.cstack .col i:nth-child(3){bottom:10px}
.cstack .col i:nth-child(4){bottom:15px}
.cstack .d5 i{background:radial-gradient(circle at 35% 32%, #d96a6a, #8f2b2b)}
.cstack .d25 i{background:radial-gradient(circle at 35% 32%, #63b07a, #2c6a42)}
.cstack .d100 i{background:radial-gradient(circle at 35% 32%, #565656, #101010)}
.cstack .d500 i{background:radial-gradient(circle at 35% 32%, #9a6bc9, #55307f)}
#bet-1{top:100px;left:calc(50% + 128px)}
#bet-0{bottom:112px;left:calc(50% - 138px)}

/* ---- cards */
.card{
  width:var(--cw);height:var(--ch);border-radius:8px;background:var(--card);
  color:var(--black);position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  font-weight:800;
}
.card.red{color:var(--red)}
body.fourc .card.s-d{color:#2e6fd0}
body.fourc .card.s-c{color:#2c8a52}
.card .cr{
  position:absolute;top:6%;left:9%;line-height:.95;text-align:center;
  font-size:calc(var(--cw)*.34);letter-spacing:-.05em;
}
.card .cr b{display:block;font-size:.8em;font-weight:800}
.card .cp{
  position:absolute;inset:12% 0 0 0;display:grid;place-items:center;
  font-size:calc(var(--cw)*.52);line-height:1;
}
.card.back{
  background:
    repeating-linear-gradient(45deg,#ffffff22 0 3px,transparent 3px 8px),
    radial-gradient(circle at 50% 45%, #24596a, #12303a);
  border:3px solid #f4efe2;
  box-shadow:inset 0 0 0 2px rgba(201,162,75,.55), 0 3px 8px rgba(0,0,0,.35);
}
.card.dead{opacity:.7;filter:saturate(.85)}
.card.win{box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(233,193,92,.5)}
@keyframes cardin{from{transform:translateY(-14px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card.flipin{animation:cardin .28s ease}

/* ---- center */
#mid{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;
}
#potrow{display:flex;align-items:flex-end;gap:10px;min-height:36px}
#potchips{display:flex;align-items:flex-end}
#pot{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14px;color:var(--gold);font-weight:800;min-height:24px;
  background:#00000048;border-radius:20px;padding:4px 16px;
  font-variant-numeric:tabular-nums;border:1px solid #ffffff10;
}
#pot.winline{transform:scale(1.2);border-color:rgba(255,217,122,.65);box-shadow:0 0 22px rgba(233,193,92,.3);background:#00000070}
#pot{transition:transform .15s}
#pot:empty{visibility:hidden}
#board{display:flex;gap:clamp(6px,.7vw,9px);min-height:calc(var(--ch) + 2px)}
#verdict{min-height:28px;display:flex;gap:10px;justify-content:center;align-items:center}
#verdict .vtag{
  font-size:13px;font-weight:800;background:#000000aa;border-radius:12px;
  padding:3px 14px;text-shadow:0 1px 3px #000;
}
#verdict .vtag.vw{color:var(--gold);border:1px solid rgba(233,193,92,.5)}
#verdict .vtag.vl{color:var(--ink-mut)}

/* ---- action bar */
#bottom{
  flex:none;padding:6px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.4) 40%, rgba(0,0,0,.6));
}
#caption{
  text-align:center;font-size:14px;font-weight:700;color:var(--gold);
  min-height:44px;padding:2px 12px;text-shadow:0 1px 3px #000;
  display:flex;align-items:center;justify-content:center;
}
#caption a{color:#5fc7d6}
#actions{display:flex;gap:10px;justify-content:center;align-items:center;min-height:58px;
  border-top:3px solid transparent;border-radius:6px;transition:background .12s,border-color .12s}
#actions.pos-btn{background:rgba(212,175,55,.13);border-top-color:var(--gold)}
#actions.pos-bb{background:rgba(90,140,220,.13);border-top-color:#5a8cdc}
#actions button{
  border:none;border-radius:10px;height:52px;min-width:150px;padding:0 22px;
  font-size:15px;font-weight:800;color:#fff;letter-spacing:.03em;position:relative;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 3px 8px rgba(0,0,0,.35);
}
#actions button:disabled{opacity:.4;cursor:default}
#b-fold{background:linear-gradient(180deg,#9c574a,#7c4237)}
#b-call{background:linear-gradient(180deg,#3f8158,#2b6142)}
#b-raise{background:linear-gradient(180deg,#d9b45a,#a8842e)}
#b-next{background:linear-gradient(180deg,#3f8158,#2b6142);min-width:200px}
#actions .sub{font-size:11px;font-weight:600;opacity:.55;font-variant-numeric:tabular-nums}
#actions .sub.hot{opacity:1;font-weight:800}
#actions .qbtn{
  background:#00000048;border:1px solid #ffffff26;color:var(--ink);
  min-width:0;width:40px;height:40px;border-radius:50%;padding:0;font-size:16px;
  margin-right:16px;box-shadow:none;
}
#actions .qbtn.on{background:var(--gold);color:#241d18;border-color:var(--gold)}

/* ---- activity log drawer */
#logdrawer{
  position:fixed;top:47px;right:0;bottom:0;width:min(320px,80vw);z-index:15;
  background:linear-gradient(180deg,#241d16f2,#1a140df6);
  border-left:1px solid #ffffff1e;transform:translateX(100%);
  transition:transform .25s ease;display:flex;flex-direction:column;
}
#logdrawer.open{transform:none}
#logdrawer .lh{
  font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--ink-mut);
  padding:12px 16px 8px;border-bottom:1px solid #ffffff14;
}
#logbody{
  flex:1;overflow-y:auto;padding:10px 16px;font-size:12.5px;line-height:1.75;
  scrollbar-width:thin;font-variant-numeric:tabular-nums;
}
#logbody .lw{color:#8fd0a0;font-weight:700}
#logbody .lh2{color:var(--gold);font-weight:800;margin-top:6px}
#logbody .lm{color:var(--ink-mut)}

/* ---- modals */
.wrap{
  position:fixed;inset:0;background:#000000aa;display:none;
  align-items:center;justify-content:center;padding:18px;z-index:20;
}
.wrap.open{display:flex}
.modal{
  user-select:text;
  background:linear-gradient(180deg,#3a302a,#2f2823);border:1px solid #ffffff22;
  border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow:auto;
  padding:24px 28px;position:relative;box-shadow:0 20px 80px #000c;color:var(--ink);
}
.modal h2{font-size:20px;letter-spacing:.04em;margin-bottom:14px;color:var(--gold)}
.modal .x{
  position:absolute;top:12px;right:14px;background:none;border:none;
  font-size:18px;color:var(--ink-soft);
}
.mbtn{font-size:13px;font-weight:700;border:none;border-radius:6px;padding:5px 14px;color:#fff}
.score-row{cursor:pointer;border-radius:6px;padding:1px 6px}
.score-row:hover{background:#ffffff10}
a{color:#5fc7d6}
@media (max-width:700px){
  #tablewrap{width:94vw;min-height:340px}
  #actions button{min-width:110px;height:46px;font-size:13px}
  .seat{width:min(64vw,230px)}
}
</style>
<style>
#actions button{min-width:96px}
#nlbadge{background:#5a3d1e;color:var(--gold);border:1px solid rgba(233,193,92,.4);border-radius:10px;
  padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.08em}
</style>

<body>

<div id="top">
  <a class="word" href="https://librepoker.org/"><b>Libre</b> Poker · <span style="color:var(--gold)">NL</span></a>
  <span class="meta" id="tmeta">no-limit hold'em · 10/20 · 100bb · heads-up</span>
  <span id="nlbadge" title="v0: the opponent is a young strategy still in training; no exact grading yet">NL v0 · training in progress</span>
  <span class="spacer"></span>
  <button class="chip" id="b-net" title="Session net"></button>
  <a class="chip" href="./" style="text-decoration:none" title="Back to the limit table">← limit</a>
</div>

<div id="stage">
  <div id="tablewrap">
  <div id="table"></div>
    <div class="seat" id="seat-1">
      <div class="who"><span class="av">🤖</span><span class="idc"><span class="nm"></span><span class="pos"></span></span><span class="stkc"><span class="stk"></span><span class="bbline"></span></span></div>
      <div class="said"></div>
      <div class="tbar"><i></i></div>
    </div>
    <div class="fcards" id="cards-1"></div>
    <div class="bet" id="bet-1"><span class="cstack"></span><span class="amt"></span></div>
    <div class="bet" id="bet-0"><span class="cstack"></span><span class="amt"></span></div>
    <div id="mid">
      <div id="potrow"><span id="potchips"></span><div id="pot"></div></div>
      <div id="board"></div>
      <div id="verdict"></div>
    </div>
    <div class="fcards" id="cards-0"></div>
    <div class="seat" id="seat-0">
      <div class="who"><span class="av">👤</span><span class="idc"><span class="nm"></span><span class="pos"></span></span><span class="stkc"><span class="stk"></span><span class="bbline"></span></span></div>
      <div class="said"></div>
      <div class="tbar"><i></i></div>
    </div>
    <div id="fx"></div>
  </div>
</div>


<div id="bottom">
  <div id="caption"></div>
  <div id="actions"></div>
</div>

<script type="module">
import { evaluate, bestFive, rankOf, suitOf, RANKS, rngFromSeed, shuffledDeck } from './engine/poker.js';
import { setEquityEdges } from './engine/ladder.js';
import { HUNL } from './engine/hunl.js';

const $ = (s) => document.querySelector(s);
const GLYPH = { c: '♣', d: '♦', h: '♥', s: '♠' };
const ascii = (c) => RANKS[rankOf(c)] + 'cdhs'[suitOf(c)];
const isRed = (a) => a[1] === 'd' || a[1] === 'h';
function cardEl(a) {
  const d = document.createElement('div');
  d.className = 'card flipin s-' + a[1] + (isRed(a) ? ' red' : '');
  d.innerHTML = `<div class="cr">${a[0] === 'T' ? '10' : a[0]}<b>${GLYPH[a[1]]}</b></div><div class="cp">${GLYPH[a[1]]}</div>`;
  return d;
}
function backEl() { const d = document.createElement('div'); d.className = 'card back'; return d; }
const DENOMS = [[500, 'd500'], [100, 'd100'], [25, 'd25'], [5, 'd5']];
function chipStackInto(el, amount) {
  el.innerHTML = '';
  let rest = Math.max(0, Math.round(amount / 5) * 5);
  for (const [v, cls] of DENOMS) {
    let n = Math.floor(rest / v); rest -= n * v;
    while (n > 0) {
      const col = document.createElement('span'); col.className = 'col ' + cls;
      for (let k = 0; k < Math.min(4, n); k++) col.appendChild(document.createElement('i'));
      el.appendChild(col); n -= Math.min(4, n);
    }
  }
}
const caption = (t) => { $('#caption').innerHTML = t; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const sha256hex = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((x) => x.toString(16).padStart(2, '0')).join('');

// ---- the strategy
let T = null;
caption('fetching the young strategy…');
T = await fetch('strategy-nl.json?v=nl0').then((r) => r.json());
if (T.edges) setEquityEdges(T.edges);
caption('');
$('#tmeta').textContent = `no-limit hold'em · 10/20 · 100bb · heads-up · opponent: ${T.iterations.toLocaleString()} iters`;

// ---- the table state (the HUNL abstract game IS the game here)
const U = 10;                               // 1 unit = 10 chips for display
let handNo = 0, net = 0;
let heroAbs = 0;                            // hero's abstract seat this hand
let st = null, holes = null, board = null, shownBoard = 0;

const seats = [0, 1].map((i) => ({
  root: $('#seat-' + i), nm: $(`#seat-${i} .nm`), pos: $(`#seat-${i} .pos`),
  stk: $(`#seat-${i} .stk`), bb: $(`#seat-${i} .bbline`), said: $(`#seat-${i} .said`),
  cards: $('#cards-' + i),
}));
const dom = (abs) => abs === heroAbs ? 0 : 1;

function render(reveal = false) {
  for (const abs of [0, 1]) {
    const d = seats[dom(abs)];
    d.nm.textContent = abs === heroAbs ? 'You' : 'NL Bot v0';
    const stack = (HUNL.STACK - st.contrib[abs]) * U;
    d.stk.textContent = stack.toLocaleString();
    d.bb.textContent = (stack / 20).toFixed(0) + ' BB';
    d.pos.textContent = abs === 0 ? 'SB' : 'BB';
    d.root.classList.toggle('glow', !st.done && st.actor === abs);
    d.cards.innerHTML = '';
    const hole = holes[abs];
    for (const c of hole) d.cards.appendChild(abs === heroAbs || reveal ? cardEl(ascii(c)) : backEl());
    const bet = $('#bet-' + dom(abs));
    const amt = st.streetC[abs] * U;
    bet.classList.toggle('show', amt > 0 && !st.done);
    if (amt > 0) { chipStackInto(bet.querySelector('.cstack'), amt); bet.querySelector('.amt').textContent = amt; }
  }
  const carried = (st.contrib[0] + st.contrib[1] - st.streetC[0] - st.streetC[1]) * U;
  $('#pot').textContent = carried > 0 ? 'Pot ' + carried.toLocaleString() : '';
  $('#board').innerHTML = '';
  for (let i = 0; i < shownBoard; i++) $('#board').appendChild(cardEl(ascii(board[i])));
  $('#table').classList.toggle('boardout', shownBoard > 0);
  const btnDom = dom(0);
  document.querySelectorAll('.dbtn').forEach((e) => e.remove());
  const db = document.createElement('span'); db.className = 'dbtn'; db.textContent = 'D';
  seats[btnDom].root.querySelector('.who').appendChild(db);
}

const BOARD_N = [0, 3, 4, 5];
function label(a, t) {
  if (a === 'f') return 'FOLD';
  if (a === 'k') return t.call > 0 ? 'CALL ' + (t.call * U) : 'CHECK';
  if (a === 'h') return '½ POT · ' + ((t.h - st.streetC[st.actor]) * U);
  if (a === 'p') return 'POT · ' + ((t.p - st.streetC[st.actor]) * U);
  return 'ALL-IN · ' + ((t.a - st.streetC[st.actor]) * U);
}
function heroTurn() {
  return new Promise((resolve) => {
    const bar = $('#actions');
    bar.innerHTML = '';
    bar.classList.toggle('pos-btn', heroAbs === 0);
    bar.classList.toggle('pos-bb', heroAbs === 1);
    const acts = HUNL.actions(st);
    const t = HUNL.targets(st);
    const order = ['f', 'k', 'h', 'p', 'a'].filter((a) => acts.includes(a));
    for (const a of order) {
      const b = document.createElement('button');
      b.id = a === 'f' ? 'b-fold' : a === 'k' ? 'b-call' : a === 'a' ? 'b-raise' : 'b-' + a;
      if (a === 'h' || a === 'p') b.style.background = '#7a5a24';
      b.textContent = label(a, t);
      b.addEventListener('click', () => { bar.innerHTML = ''; resolve(a); });
      bar.appendChild(b);
    }
    keymap = order;
  });
}
let keymap = null;
document.addEventListener('keydown', (e) => {
  if (!keymap) return;
  const K = { 1: 'f', 2: 'k', 3: 'h', 4: 'p', 5: 'a' };
  const a = K[e.key];
  if (a && keymap.includes(a)) {
    const btns = [...document.querySelectorAll('#actions button')];
    const idx = keymap.indexOf(a);
    if (btns[idx]) { keymap = null; btns[idx].click(); }
  }
});

function botAct() {
  const key = HUNL.infoset(st, holes[1 - heroAbs], board.slice(0, BOARD_N[st.street]));
  const acts = HUNL.actions(st);
  const probs = (T.table[key] && T.table[key].length === acts.length) ? T.table[key] : acts.map(() => 1 / acts.length);
  let x = Math.random(), pick = acts.length - 1;
  for (let i = 0; i < acts.length; i++) { x -= probs[i]; if (x <= 0) { pick = i; break; } }
  return acts[pick];
}

async function playHand() {
  handNo++;
  heroAbs = handNo % 2;
  const seed = await sha256hex(`nl|${Date.now()}|${handNo}|${Math.random()}`);
  const deck = shuffledDeck(seed);
  holes = [[deck[0], deck[1]], [deck[2], deck[3]]];
  board = deck.slice(4, 9);
  shownBoard = 0;
  st = HUNL.initial();
  $('#verdict').textContent = '';
  document.querySelectorAll('#board .card, .fcards .card').forEach((el) => el.classList.remove('win', 'dead'));
  render();
  caption('');
  let lastStreet = 0;
  while (!st.done) {
    if (st.street !== lastStreet) { lastStreet = st.street; shownBoard = BOARD_N[st.street]; render(); await sleep(250); }
    const said = seats[dom(st.actor)].said;
    let a;
    if (st.actor === heroAbs) a = await heroTurn();
    else { await sleep(300 + Math.random() * 400); a = botAct(); }
    const t = HUNL.targets(st);
    said.textContent = label(a, t).toLowerCase();
    st = HUNL.apply(st, a);
    render();
  }
  // runout if all-in ended betting early
  while (shownBoard < 5 && st.folded < 0) {
    shownBoard = BOARD_N[Math.min(3, BOARD_N.indexOf(shownBoard) + 1)] || 5;
    render(true); await sleep(450);
  }
  // settle
  const u0 = HUNL.utility(st, holes, board);
  const heroU = (heroAbs === 0 ? u0 : -u0) * U;
  net += heroU;
  const showdown = st.folded < 0;
  render(showdown);
  if (showdown) {
    const winAbs = u0 > 0 ? 0 : u0 < 0 ? 1 : -1;
    const winCards = new Set();
    for (const w of winAbs < 0 ? [0, 1] : [winAbs]) for (const c of bestFive([...holes[w], ...board])) winCards.add(c);
    [...$('#board').children].forEach((el, bi) => el.classList.add(winCards.has(board[bi]) ? 'win' : 'dead'));
    const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
    $('#verdict').innerHTML = [0, 1].map((abs) =>
      `<span class="vtag ${winAbs === abs || winAbs < 0 ? 'vw' : 'vl'}">${abs === heroAbs ? 'You' : 'Bot'}: ${evaluate([...holes[abs], ...board]).score && cap(String(RANKS[rankOf(bestFive([...holes[abs], ...board])[0])]))}…</span>`).join('');
  }
  $('#pot').classList.add('winline');
  $('#pot').textContent = heroU > 0 ? 'You win ' + heroU : heroU < 0 ? 'Bot wins ' + (-heroU) : 'Split pot';
  $('#b-net').textContent = '🏦 ' + (net >= 0 ? '+' : '') + net.toLocaleString();
  seats.forEach((s2) => { s2.said.textContent = ''; });
  await new Promise((resolve) => {
    const bar = $('#actions');
    const bn = document.createElement('button');
    bn.id = 'b-next'; bn.textContent = 'NEXT HAND';
    bn.addEventListener('click', resolve);
    bar.appendChild(bn);
    keymap = null;
    const k = (e) => { if (e.key === '1' || e.key === 'Enter') { document.removeEventListener('keydown', k); resolve(); } };
    document.addEventListener('keydown', k);
    setTimeout(resolve, st.folded >= 0 ? 1400 : 2600);
  });
  $('#actions').innerHTML = '';
  $('#pot').classList.remove('winline');
}
(async () => { for (;;) await playHand(); })();
</script>
